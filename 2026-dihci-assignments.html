<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>2026 DiHCI Assignments — Weeks 1–8</title><style>:root{--bg:#f4f6f8;--card:#fff;--text:#111827;--muted:#64748b;--border:#e2e8f0;--shadow:0 8px 24px rgba(15,23,42,.07);--accent:#111827;--soft:#eef2ff;--softText:#3730a3;--green:#118a3a;--red:#c0262d}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1200px;margin:0 auto;padding:26px 18px 54px}header{text-align:center;padding:12px 0 22px}h1{margin:0 0 9px;font-size:clamp(28px,4vw,48px);line-height:1.08;color:#000;font-weight:800}.subtitle{margin:0 auto;max-width:850px;font-size:15px;color:var(--muted);line-height:1.55}
.page-nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:6px auto 18px}.page-btn{border:1px solid var(--border);background:#fff;color:#334155;border-radius:999px;padding:11px 20px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 2px 8px rgba(15,23,42,.03)}.page-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.page{display:none}.page.active{display:block}.page-title{text-align:center;font-size:18px;font-weight:800;margin:8px 0 14px}.week-nav{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:0 auto 14px}.week-btn{border:1px solid var(--border);background:#fff;color:#334155;border-radius:999px;padding:10px 15px;font-size:14px;font-weight:800;cursor:pointer}.week-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.toolbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0 14px}.toolbar button,.sticky-submit button{border:0;border-radius:12px;padding:12px 20px;font-size:15px;font-weight:800;cursor:pointer}.btn-primary{background:var(--accent);color:#fff}.btn-secondary{background:#e5e7eb;color:#374151}.meta{text-align:center;color:var(--muted);font-size:14px;margin-bottom:18px}
form{display:grid;gap:16px}.question-card{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:20px}.qtop{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:12px}.qtitle{font-size:17px;line-height:1.55;margin:0;font-weight:600}.week-badge{flex:0 0 auto;background:var(--soft);color:var(--softText);border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800}.options{display:grid;gap:9px}label.opt{display:flex;gap:10px;align-items:flex-start;line-height:1.45;font-size:15px;cursor:pointer;padding:4px 0}label.opt input{margin-top:4px;accent-color:#111827}.result{margin-top:12px;font-size:14px;font-weight:800;min-height:20px}.correct{color:var(--green)}.wrong{color:var(--red)}
.scorebox{margin-top:20px;background:#fff;border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:18px;text-align:center;font-size:18px;font-weight:800}.scoredetails{display:block;margin-top:8px;color:var(--muted);font-size:14px}.sticky-submit{position:sticky;bottom:14px;z-index:5;display:flex;justify-content:center;margin-top:18px}.sticky-submit button{box-shadow:0 10px 24px rgba(0,0,0,.14)}.hidden{display:none!important}
@media(max-width:640px){.wrap{padding:18px 12px 42px}.question-card{padding:16px}.qtitle{font-size:16px}.page-btn{padding:10px 15px}.week-btn{padding:9px 12px}}
</style></head>
<body><div class="wrap">
<header><h1>2026 DiHCI Assignments</h1><p class="subtitle">Interactive week-wise practice with shuffled questions and options, instant scoring, and correct-answer feedback.</p></header>
<nav class="page-nav" aria-label="Assignment groups">
<button class="page-btn active" data-page="p14">Weeks 1–4 <span class="count">(40)</span></button>
<button class="page-btn" data-page="p58">Weeks 5–8 <span class="count">(40)</span></button>
</nav>
<section id="p14" class="page active"><div class="page-title">Weeks 1–4</div><div class="week-nav" id="weekNav14"></div><div class="toolbar"><button class="btn-primary submit-btn">Submit</button><button class="btn-secondary reset-btn">Reset</button></div><div class="meta meta-line"></div><form class="quiz-form"></form><div class="sticky-submit"><button class="btn-primary submit-btn">Submit</button></div><div class="scorebox">Submit the quiz to see your score.</div></section>
<section id="p58" class="page"><div class="page-title">Weeks 5–8</div><div class="week-nav" id="weekNav58"></div><div class="toolbar"><button class="btn-primary submit-btn">Submit</button><button class="btn-secondary reset-btn">Reset</button></div><div class="meta meta-line"></div><form class="quiz-form"></form><div class="sticky-submit"><button class="btn-primary submit-btn">Submit</button></div><div class="scorebox">Submit the quiz to see your score.</div></section>
</div>
<script>
const quizData=[{"week":1,"q":"While we talk about the evaluation phases of the computer, ______ is called the modern age of computers.","options":["1985 onwards","1998 onwards","2007 onwards","2011 onwards"],"answer":"2011 onwards","id":1},{"week":1,"q":"Which among the following is NOT a generic category of users?","options":["Novice","Super knowledgeable","Intermittent","Expert"],"answer":"Super knowledgeable","id":2},{"week":1,"q":"In the Spiral Model, why is the second quadrant crucial for interactive software development?","options":["It defines the UI layout","It finalizes the system architecture","It identifies and mitigates usability risks via prototyping","It handles testing and deployment"],"answer":"It identifies and mitigates usability risks via prototyping","id":3},{"week":1,"q":"What does the term 'utility' refer to in the context of usability?","options":["Speed of task completion","Visual appeal of the design","Functional support for user needs","Frequency of feature updates"],"answer":"Functional support for user needs","id":4},{"week":1,"q":"Which one of the following is NOT a computer?","options":["Desktop","Digital Pedometer","Smartphone","None of the above"],"answer":"None of the above","id":5},{"week":1,"q":"Interactive software development is ______ in nature.","options":["sporadic","iterative","variable","discrete"],"answer":"iterative","id":6},{"week":1,"q":"Which of the following is NOT one of the five quality components of usability proposed by Jacob Nielsen?","options":["Learnability","Efficiency","Satisfaction","Memorization"],"answer":"Memorization","id":7},{"week":1,"q":"Which of the following is NOT a characteristic of the Waterfall model?","options":["Feasibility study","Learnability study","System integration and testing","Maintenance"],"answer":"Learnability study","id":8},{"week":1,"q":"'Identify objectives' and 'customer evaluation and planning' is in the ______ and ______ quadrant of the spiral model respectively.","options":["First, Fourth","Second, Third","Third, Fourth","Fourth, Second"],"answer":"First, Fourth","id":9},{"week":1,"q":"Which design approach focuses on what a programmer finds interesting to build?","options":["System-Centered Design","User-Centered Design","Utility-Based Design","Participatory Design"],"answer":"System-Centered Design","id":10},{"week":2,"q":"Contextual inquiry is also known as ________.","options":["Interview","Observation","Semi-structured interview"],"answer":"Semi-structured interview","id":11},{"week":2,"q":"In SRS, functions are not represented as","options":["Function name","Input","Output","Description","Motivation"],"answer":"Motivation","id":12},{"week":2,"q":"Contextual inquiry can be done in ______ and passive mode.","options":["active","semi-active","neutral"],"answer":"active","id":13},{"week":2,"q":"There are ______ stages in contextual inquiry.","options":["two","five","six","eight"],"answer":"five","id":14},{"week":2,"q":"Which stage in the Contextual Inquiry process involves arranging for recording observations and scripting the procedure?","options":["Plan Stage","Initiate Stage","Execute Stage","Reflect Stage"],"answer":"Plan Stage","id":15},{"week":2,"q":"Affinity diagram method consists of ______ steps.","options":["Three","Two","Six","Five"],"answer":"Five","id":16},{"week":2,"q":"Usability requirements is one type of ______.","options":["Functional Requirement","Non-functional requirement"],"answer":"Non-functional requirement","id":17},{"week":2,"q":"What is the primary objective of Contextual Inquiry?","options":["To watch and observe users perform tasks in their natural work setting","To conduct semi-structured interviews with users","To develop design recommendations","To study user behavior using physical note-taking"],"answer":"To watch and observe users perform tasks in their natural work setting","id":18},{"week":2,"q":"What is the purpose of the 'Reflect' stage in the Contextual Inquiry process?","options":["To contact the authorities for permission","To analyze the data collected and identify design goals","To script the procedure and rehearse for observations"],"answer":"To analyze the data collected and identify design goals","id":19},{"week":2,"q":"How long does the Contextual Inquiry process typically continue?","options":["One to two weeks","One to two hours","One to two months"],"answer":"One to two hours","id":20},{"week":3,"q":"In SRS document the functions should describe HOW to get the output from the given input.","options":["True","False"],"answer":"False","id":21},{"week":3,"q":"We can also add new functional requirements based on the observations made in contextual inquiry.","options":["True","False"],"answer":"True","id":22},{"week":3,"q":"In user-centered design, we have two concerns: Interface design and","options":["Machine design","Hardware design","Code design","System design"],"answer":"Code design","id":23},{"week":3,"q":"The design-prototype-evaluate cycle primarily caters to ______ design.","options":["Interface","Code","System"],"answer":"Interface","id":24},{"week":3,"q":"Code design can be expressed in natural languages, semi-formal languages and ________.","options":["Informal languages","Formal languages","Context sensitive languages"],"answer":"Formal languages","id":25},{"week":3,"q":"DFD is a ______ code design language.","options":["Natural","Semi-formal","Informal","Context sensitive"],"answer":"Semi-formal","id":26},{"week":3,"q":"Shneiderman proposed ______ rules that covers broad aspects of interactive systems.","options":["Five","Seven","Eight","Nine"],"answer":"Eight","id":27},{"week":3,"q":"'The interface should not force users to remember too many things' — this statement falls under '__________', one of the golden rules proposed by Ben Shneiderman.","options":["Strive for consistency","Permit easy reversal of actions","Reduce short-term memory load","Keep users in control"],"answer":"Reduce short-term memory load","id":28},{"week":3,"q":"Human interface guidelines for the Apple systems are the ________ design guidelines.","options":["Generic","Specific"],"answer":"Specific","id":29},{"week":3,"q":"Identification of data structures and algorithms for different modules is done on the ________ phase of code design.","options":["Preliminary (high-level design)","Detailed design"],"answer":"Detailed design","id":30},{"week":4,"q":"Norman's Model of Interaction represents behavior of a user of interactive systems in terms of a series of ________.","options":["actions","selection","manipulation"],"answer":"actions","id":31},{"week":4,"q":"There are broadly two stages of interaction: execution stage and ______ stage.","options":["design","evaluation","interaction"],"answer":"evaluation","id":32},{"week":4,"q":"Perceive system state comes under the ______ stage of interaction.","options":["execution","design","evaluation","interaction"],"answer":"evaluation","id":33},{"week":4,"q":"Actions we specify to translate intentions may not be supported by the interface leading to a gap (gulf) between the first three and the last actions in the execution stage. It is called ______.","options":["The gulf of execution","The gulf of evaluation","The gulf of Interaction"],"answer":"The gulf of execution","id":34},{"week":4,"q":"Particularly in the context of errors during interaction is explained in terms of slips and ______.","options":["error","mistakes","human error"],"answer":"mistakes","id":35},{"week":4,"q":"In a vertical prototype, the entire interface is depicted at the surface level without any functionality.","options":["True","False"],"answer":"False","id":36},{"week":4,"q":"Paper mock-ups are the example of ______ prototype.","options":["Low fidelity","High fidelity","Medium fidelity"],"answer":"Low fidelity","id":37},{"week":4,"q":"There is a requirement of 3-5 member team for the cognitive walkthrough.","options":["True","False"],"answer":"True","id":38},{"week":4,"q":"In a cognitive walkthrough evaluation, evaluators are expected to answer the questions only in 'yes' or 'no'.","options":["True","False"],"answer":"False","id":39},{"week":4,"q":"In this technique, a human subject believes to interact with an autonomous computer. But, in reality, however, the computer is operated by an 'unseen' human being. This technique is called ______ approach.","options":["Medium fidelity","Vertical","Wizard of Oz","Incremental"],"answer":"Wizard of Oz","id":40},{"week":5,"q":"How do we evaluate an interface?","options":["by evaluating satisfaction","by evaluating memorability","by evaluating usability"],"answer":"by evaluating usability","id":41},{"week":5,"q":"We need to frame a set of questions (usability issues) for the evaluators before performing a cognitive walkthrough.","options":["True","False"],"answer":"True","id":42},{"week":5,"q":"In a heuristic evaluation, the items in the checklist are called __________.","options":["checkbox","heuristics","usability issues","problems"],"answer":"heuristics","id":43},{"week":5,"q":"There are many ways of collecting user feedback in evaluation with self report methods: ______________, can ask them to choose from a list of system attributes and ask direct and open-ended questions.","options":["Utter the option","Rating on a scale"],"answer":"Rating on a scale","id":44},{"week":5,"q":"ASQ is a ___________________.","options":["Post-task questionnaire","Post-session questionnaire"],"answer":"Post-task questionnaire","id":45},{"week":5,"q":"It is generally assumed that an SUS score around _______ percent or higher is desirable.","options":["10","20","50","70"],"answer":"70","id":46},{"week":5,"q":"In expert evaluation, the evaluation team should have at least _________ members.","options":["3-5","4-7","5-7","7-9"],"answer":"3-5","id":47},{"week":5,"q":"In heuristic evaluation, a system is evaluated with a checklist are called ____.","options":["Heuristics","Actions","Statement"],"answer":"Heuristics","id":48},{"week":5,"q":"What is the full form of SUS?","options":["Software usability score","Software usability scale","System usability score","System usability scale"],"answer":"System usability scale","id":49},{"week":5,"q":"Which are from the following are the valid prototype evaluation methods?","options":["Cognitive walkthrough","Affinity diagram","Heuristic evaluation","Cognitive walkthrough and Heuristic evaluation"],"answer":"Cognitive walkthrough and Heuristic evaluation","id":50},{"week":6,"q":"Which of the following is NOT a characteristic of Good design?","options":["Coverage","Correctness","Understandability","Colorful"],"answer":"Colorful","id":51},{"week":6,"q":"If all functions perform similar operations it falls under ________ cohesion.","options":["Logical","Temporal","Procedural","Sequential"],"answer":"Logical","id":52},{"week":6,"q":"If two modules share code, it falls under __________ coupling.","options":["Data","Control","Content"],"answer":"Content","id":53},{"week":6,"q":"There are two basic design approaches: function oriented and _______ oriented.","options":["Logic","Folder","Object","Class"],"answer":"Object","id":54},{"week":6,"q":"Basic components of ER diagram are: Entity, _____ and Relationship.","options":["Object","User","Attribute","Class"],"answer":"Attribute","id":55},{"week":6,"q":"Null attributes are used when:","options":["An entity does not have a value for an attribute","A value needs to be derived from other attributes or entities"],"answer":"An entity does not have a value for an attribute","id":56},{"week":6,"q":"There are four types of relationships in ER diagram: one-to-one, one-to-many, many-to-one and _______.","options":["Many-to-binary","Many-to-many","Binary-to-many","Binary-to-one"],"answer":"Many-to-many","id":57},{"week":6,"q":"Which of the following is/are the type of cohesion?","options":["Temporal","Functional","Content","Temporal and Functional"],"answer":"Temporal and Functional","id":58},{"week":6,"q":"Which one from the following are related with between modules?","options":["Cohesion","Coupling","Both"],"answer":"Coupling","id":59},{"week":6,"q":"What is the full form of the DFD?","options":["Data flow design","Data flow decision","Data flow development","Data flow diagram"],"answer":"Data flow diagram","id":60},{"week":7,"q":"In functional design approach we think of the system as provider of a set of “services” represented as ________.","options":["Data","Functions","Objects"],"answer":"Functions","id":61},{"week":7,"q":"In “Object Oriented Design approach”, we do not consider “services” offered by system.","options":["True","False"],"answer":"True","id":62},{"week":7,"q":"A class contains attributes and ___________.","options":["Data","Operations","Objects"],"answer":"Operations","id":63},{"week":7,"q":"Attribute indicates nature of data that an object can contain.","options":["True","False"],"answer":"True","id":64},{"week":7,"q":"Full form of OOA is:","options":["object oriented assignment","object oriented assistance","object oriented analysis","object oriented attributes"],"answer":"object oriented analysis","id":65},{"week":7,"q":"________ effectively denotes the behavior of class.","options":["Data","Operations","Objects","Attributes"],"answer":"Operations","id":66},{"week":7,"q":"UML is a language to represent","options":["OOP","OOA","OOD"],"answer":"OOD","id":67},{"week":7,"q":"UML is a design methodology.","options":["True","False"],"answer":"False","id":68},{"week":7,"q":"Implementation view can be captured using ________.","options":["Deployment diagram","Component diagram","Class diagram","Use case diagram"],"answer":"Component diagram","id":69},{"week":7,"q":"________ objects normally hold information (e.g. book, book registers etc).","options":["Boundary","Controller","Entity"],"answer":"Entity","id":70},{"week":8,"q":"Following standard coding guidelines helps to improve ______.","options":["Readability only","Understandability only","Teamwork only","Readability, understandability, and teamwork"],"answer":"Readability, understandability, and teamwork","id":71},{"week":8,"q":"A function should have no longer than _____ lines of code.","options":["5","16","10","8"],"answer":"10","id":72},{"week":8,"q":"What are some things to avoid when writing code? (Choose all that apply)","options":["Using lengthy functions","Using the same identifier for multiple purposes","Using ‘goto’ (branching) statements indiscriminately","Using proper indentation","Using lengthy functions, same identifier for multiple purposes, and indiscriminate goto statements"],"answer":"Using lengthy functions, same identifier for multiple purposes, and indiscriminate goto statements","id":73},{"week":8,"q":"Two broad categories of code testing methods are review-based method and __________ method.","options":["Manual testing","Execution-based"],"answer":"Execution-based","id":74},{"week":8,"q":"What are the two common methods for review-based testing? (Choose all that apply)","options":["Code inspection","Code walkthrough","Unit testing","Code inspection and Code walkthrough"],"answer":"Code inspection and Code walkthrough","id":75},{"week":8,"q":"White-box testing refers to designing test cases using knowledge of internal structure of the software.","options":["True","False"],"answer":"True","id":76},{"week":8,"q":"How many members should be present in a code walkthrough team?","options":["2–3 members","3–5 members","5–7 members","7–10 members"],"answer":"3–5 members","id":77},{"week":8,"q":"Which of the following code testing method requires simulation of code execution by hand?","options":["Code walkthrough","Code inspection","Black box testing","White box testing"],"answer":"Code walkthrough","id":78},{"week":8,"q":"Uninitialized variable is one of the common errors in programming that can be identified through code inspection.","options":["True","False"],"answer":"True","id":79},{"week":8,"q":"Which of the following is not required to perform black box testing?","options":["Equivalence class partitioning","Boundary value analysis","Test suite creation","Knowledge of the internal structure of the code"],"answer":"Knowledge of the internal structure of the code","id":80}];
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function norm(s){return String(s).trim().toLowerCase().replace(/\s+/g," ")}

const groups={
  p14:{weeks:[1,2,3,4],all:quizData.filter(q=>q.week<=4)},
  p58:{weeks:[5,6,7,8],all:quizData.filter(q=>q.week>=5&&q.week<=8)}
};
const state={p14:{week:'all',answers:new Map(),order:[]},p58:{week:'all',answers:new Map(),order:[]}};

function setupPage(pageId){
  const page=document.getElementById(pageId), g=groups[pageId], st=state[pageId];
  const nav=page.querySelector('.week-nav');
  nav.innerHTML='';
  const allBtn=document.createElement('button'); allBtn.className='week-btn active'; allBtn.textContent='All Weeks'; allBtn.dataset.week='all'; nav.appendChild(allBtn);
  g.weeks.forEach(w=>{const b=document.createElement('button');b.className='week-btn';b.textContent=`Week ${w} (${g.all.filter(q=>q.week===w).length})`;b.dataset.week=w;nav.appendChild(b)});
  nav.addEventListener('click',e=>{const b=e.target.closest('.week-btn');if(!b)return;st.week=b.dataset.week;nav.querySelectorAll('.week-btn').forEach(x=>x.classList.toggle('active',x===b));renderPage(pageId)});
  page.querySelectorAll('.submit-btn').forEach(b=>b.addEventListener('click',()=>submitPage(pageId)));
  page.querySelector('.reset-btn').addEventListener('click',()=>resetPage(pageId));
  renderPage(pageId);
}

function visibleQuestions(pageId){
  const st=state[pageId], g=groups[pageId];
  const base=st.week==='all'?g.all:g.all.filter(q=>q.week===Number(st.week));
  if(st.order.length!==base.length || !base.every(q=>st.order.includes(q.id))) st.order=shuffle(base.map(q=>q.id));
  const byId=new Map(base.map(q=>[q.id,q]));
  return st.order.map(id=>byId.get(id)).filter(Boolean);
}

function renderPage(pageId){
  const page=document.getElementById(pageId), st=state[pageId], qs=visibleQuestions(pageId), form=page.querySelector('.quiz-form');
  form.innerHTML='';
  qs.forEach((x,i)=>{
    const opts=shuffle(x.options), card=document.createElement('div'); card.className='question-card'; card.dataset.id=x.id;
    const saved=st.answers.get(x.id);
    card.innerHTML=`<div class="qtop"><p class="qtitle">${i+1}) ${esc(x.q)}</p><div class="week-badge">Week ${x.week}</div></div><div class="options">${opts.map(o=>`<label class="opt"><input type="radio" name="${pageId}-q${x.id}" value="${esc(o)}" ${saved===o?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div><div class="result" id="${pageId}-r-${x.id}"></div>`;
    card.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>st.answers.set(x.id,inp.value)));
    form.appendChild(card);
  });
  const scope=st.week==='all'?`Weeks ${groups[pageId].weeks[0]}–${groups[pageId].weeks.at(-1)}`:`Week ${st.week}`;
  page.querySelector('.meta-line').textContent=`${qs.length} questions • ${scope} • Questions and options shuffle when the view is reset or loaded.`;
  page.querySelector('.scorebox').textContent='Submit the quiz to see your score.';
}

function submitPage(pageId){
  const page=document.getElementById(pageId), st=state[pageId], qs=visibleQuestions(pageId); let score=0,c=0,w=0,b=0;
  qs.forEach(x=>{const sel=st.answers.get(x.id),r=page.querySelector(`#${pageId}-r-${x.id}`);if(sel==null){b++;r.textContent=`Not Answered | Correct: ${x.answer}`;r.className='result wrong'}else if(norm(sel)===norm(x.answer)){score++;c++;r.textContent='Correct';r.className='result correct'}else{w++;r.textContent=`Wrong | Correct: ${x.answer}`;r.className='result wrong'}});
  page.querySelector('.scorebox').innerHTML=`Final Score: ${score} / ${qs.length}<span class="scoredetails">Correct: ${c} &nbsp;|&nbsp; Wrong: ${w} &nbsp;|&nbsp; Not Answered: ${b}</span>`;
}
function resetPage(pageId){state[pageId].answers.clear();state[pageId].order=[];renderPage(pageId);document.getElementById(pageId).scrollIntoView({behavior:'smooth',block:'start'})}

document.querySelectorAll('.page-btn').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.page-btn').forEach(b=>b.classList.toggle('active',b===btn));document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===btn.dataset.page));window.scrollTo({top:0,behavior:'smooth'})}));
setupPage('p14'); setupPage('p58');
</script></body></html>

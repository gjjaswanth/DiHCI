<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2022 DiHCI Assignments</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#111827;--muted:#6b7280;--border:#e5e7eb;--shadow:0 8px 24px rgba(0,0,0,.06);--green:#118a3a;--red:#c0262d;--accent:#111827;--soft:#eef2ff;--softText:#3730a3}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1200px;margin:0 auto;padding:28px 18px 48px} header{text-align:center;padding:18px 0 26px}
h1{margin:0 0 10px;font-size:clamp(30px,4vw,52px);line-height:1.05;color:#000;font-weight:800}
.subtitle{margin:0 auto;max-width:820px;font-size:15px;color:var(--muted);line-height:1.6}
.toolbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
button{border:0;border-radius:12px;padding:12px 20px;font-size:15px;font-weight:800;cursor:pointer}
.btn-primary{background:var(--accent);color:#fff}.btn-secondary{background:#e5e7eb;color:#374151}
.meta{text-align:center;color:var(--muted);font-size:14px;margin-bottom:18px}
form{display:grid;gap:16px}.question-card{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:20px}
.qtop{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:12px}
.qtitle{font-size:17px;line-height:1.55;margin:0;font-weight:600}.week-badge{flex:0 0 auto;background:var(--soft);color:var(--softText);border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800}
.options{display:grid;gap:9px}label.opt{display:flex;gap:10px;align-items:flex-start;line-height:1.45;font-size:15px;cursor:pointer}label.opt input{margin-top:4px}
.text-answer{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-size:15px}
.result{margin-top:12px;font-size:14px;font-weight:800;min-height:20px}.correct{color:var(--green)}.wrong{color:var(--red)}
.scorebox{margin-top:20px;background:#fff;border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:18px;text-align:center;font-size:18px;font-weight:800}
.scoredetails{display:block;margin-top:8px;color:var(--muted);font-size:14px}.sticky-submit{position:sticky;bottom:14px;z-index:3;display:flex;justify-content:center;margin-top:18px}
.sticky-submit button{box-shadow:0 10px 24px rgba(0,0,0,.14)}@media(max-width:640px){.question-card{padding:16px}.qtitle{font-size:16px}}
</style>
</head>
<body><div class="wrap">
<header><h1>2022 DiHCI Assignments</h1><p class="subtitle">Interactive week-wise practice with shuffled questions and options, instant scoring, and correct-answer feedback.</p></header>
<div class="toolbar"><button class="btn-primary" type="button" onclick="submitQuiz()">Submit</button><button class="btn-secondary" type="button" onclick="resetQuiz()">Reset</button></div>
<div class="meta" id="metaLine"></div><form id="quizForm"></form>
<div class="sticky-submit"><button class="btn-primary" type="button" onclick="submitQuiz()">Submit</button></div>

<script>
const quizData=[{"week": 1, "q": "While we talk about the evaluation phases of the computer, _______ is called the modern age of computers.", "type": "single", "options": ["1985 onwards", "1998 onwards", "2007 onwards", "2011 onwards"], "answer": "2011 onwards"}, {"week": 1, "q": "Which among the following is NOT a generic category of users?", "type": "single", "options": ["Novice", "Super knowledgeable", "Intermittent", "Expert"], "answer": "Super knowledgeable"}, {"week": 1, "q": "In the Spiral Model, why is the second quadrant crucial for interactive software development?", "type": "single", "options": ["It defines the UI layout", "It finalizes the system architecture", "It identifies and mitigates usability risks via prototyping", "It handles testing and deployment"], "answer": "It identifies and mitigates usability risks via prototyping"}, {"week": 1, "q": "What does the term 'utility' refer to in the context of usability?", "type": "single", "options": ["Speed of task completion", "Visual appeal of the design", "Functional support for user needs", "Frequency of feature updates"], "answer": "Functional support for user needs"}, {"week": 1, "q": "Which one of the following is NOT a computer?", "type": "single", "options": ["Desktop", "Digital Pedometer", "Smartphone", "None of the above"], "answer": "None of the above"}, {"week": 1, "q": "Interactive software development is _______ in nature.", "type": "single", "options": ["sporadic", "iterative", "variable", "discrete"], "answer": "iterative"}, {"week": 1, "q": "Which of the following is NOT one of the five quality components of usability proposed by Jacob Nielsen?", "type": "single", "options": ["Learnability", "Efficiency", "Satisfaction", "Memorization"], "answer": "Memorization"}, {"week": 1, "q": "Which of the following is NOT a characteristic of the Waterfall model?", "type": "single", "options": ["Feasibility study", "Learnability study", "System integration and testing", "Maintenance"], "answer": "Learnability study"}, {"week": 1, "q": "‘Identify objectives’ and ‘customer evaluation and planning’ is in the ______ and ______ quadrant of the spiral model respectively.", "type": "single", "options": ["First, Fourth", "Second, Third", "Third, Fourth", "Fourth, Second"], "answer": "First, Fourth"}, {"week": 1, "q": "Which design approach focuses on what a programmer finds interesting to build?", "type": "single", "options": ["System-Centered Design", "User-Centered Design", "Utility-Based Design", "Participatory Design"], "answer": "System-Centered Design"}, {"week": 2, "q": "Contextual inquiry is also known as _______.", "type": "single", "options": ["Interview", "Observation", "Semi-structured interview"], "answer": "Semi-structured interview"}, {"week": 2, "q": "In SRS, functions are not represented as", "type": "single", "options": ["Function name", "Input", "Output", "Description", "Motivation"], "answer": "Motivation"}, {"week": 2, "q": "Contextual inquiry can be done in _______ and passive mode.", "type": "single", "options": ["active", "semi-active", "neutral"], "answer": "active"}, {"week": 2, "q": "There are _______ stages in contextual inquiry.", "type": "single", "options": ["two", "five", "six", "eight"], "answer": "five"}, {"week": 2, "q": "Which stage in the Contextual Inquiry process involves arranging for recording observations and scripting the procedure?", "type": "single", "options": ["Plan Stage", "Initiate Stage", "Execute Stage", "Reflect Stage"], "answer": "Plan Stage"}, {"week": 2, "q": "Affinity diagram method consists of _______ steps.", "type": "single", "options": ["Three", "Two", "Six", "Five"], "answer": "Five"}, {"week": 2, "q": "Usability requirements is one type of ______.", "type": "single", "options": ["Functional Requirement", "Non-functional requirement"], "answer": "Non-functional requirement"}, {"week": 2, "q": "What is the primary objective of Contextual Inquiry?", "type": "single", "options": ["To watch and observe users perform tasks in their natural work setting", "To conduct semi-structured interviews with users", "To develop design recommendations", "To study user behavior using physical note-taking"], "answer": "To watch and observe users perform tasks in their natural work setting"}, {"week": 2, "q": "What is the purpose of the \"Reflect\" stage in the Contextual Inquiry process?", "type": "single", "options": ["To contact the authorities for permission", "To analyze the data collected and identify design goals", "To script the procedure and rehearse for observations"], "answer": "To analyze the data collected and identify design goals"}, {"week": 2, "q": "How long does the Contextual Inquiry process typically continue?", "type": "single", "options": ["One to two weeks", "One to two hours", "One to two months"], "answer": "One to two hours"}, {"week": 3, "q": "In SRS document the functions should describe HOW to get the output from the given input.", "type": "single", "options": ["True", "False"], "answer": "False"}, {"week": 3, "q": "We can also add new functional requirements based on the observations made in contextual inquiry.", "type": "single", "options": ["True", "False"], "answer": "True"}, {"week": 3, "q": "In user-centered design, we have two concerns: Interface design and __________.", "type": "single", "options": ["Machine design", "Hardware design", "Code design", "System design"], "answer": "Code design"}, {"week": 3, "q": "The design-prototype-evaluate cycle primarily caters to ______ design.", "type": "single", "options": ["Interface", "Code", "System"], "answer": "Interface"}, {"week": 3, "q": "Code design can be expressed in natural languages, semi-formal languages and _________.", "type": "single", "options": ["Informal languages", "Formal languages", "Context sensitive languages"], "answer": "Formal languages"}, {"week": 3, "q": "DFD is a _______ code design language.", "type": "single", "options": ["Natural", "Semi-formal", "Informal", "Context sensitive"], "answer": "Semi-formal"}, {"week": 3, "q": "Shneiderman proposed _____ rules that covers broad aspects of interactive systems.", "type": "single", "options": ["Five", "Seven", "Eight", "Nine"], "answer": "Eight"}, {"week": 3, "q": "“The interface should not force users to remember too many things” – this statement falls under “_______”, one of the golden rules proposed by Shneiderman.", "type": "single", "options": ["Strive for consistency", "Permit easy reversal of actions", "Reduce short-term memory load", "Keep users in control"], "answer": "Reduce short-term memory load"}, {"week": 3, "q": "Human interface guidelines for the apple systems are the ________ design guidelines.", "type": "single", "options": ["Generic", "Specific"], "answer": "Specific"}, {"week": 3, "q": "Identification of data structures and algorithms for different modules is done on the ____________ phase of code design.", "type": "single", "options": ["Preliminary (high-level design)", "Detailed design"], "answer": "Detailed design"}, {"week": 4, "q": "Norman’s Model of Interaction represents behavior of a user of interactive systems in terms of a series of _________.", "type": "single", "options": ["actions", "selection", "manipulation"], "answer": "actions"}, {"week": 4, "q": "The eight golden rules for interface design were proposed by Ben Shneiderman in the year ______ (fill in the blank with the correct year in the format yyyy).", "type": "text", "answer": "1986"}, {"week": 4, "q": "One of the eight golden rules of Shneiderman is “strive for consistency”. It actually refers to", "type": "single", "options": ["Both the “internal” and “external” consistency", "Only external consistency", "Only internal consistency", "None of the above"], "answer": "Both the “internal” and “external” consistency"}, {"week": 4, "q": "There are broadly two stages of interaction execution stage and ________ stage.", "type": "single", "options": ["design", "evaluation", "interaction"], "answer": "evaluation"}, {"week": 4, "q": "Perceive system state comes under the _______ stage of interaction.", "type": "single", "options": ["execution", "design", "evaluation", "interaction"], "answer": "evaluation"}, {"week": 4, "q": "Actions we specify to translate intentions may not be supported by the interface leading to gap(gulf) between the first three and the last actions in the execution stage- It is called _______.", "type": "single", "options": ["The gulf of execution", "The gulf of evaluation", "The gulf of Interaction"], "answer": "The gulf of execution"}, {"week": 4, "q": "Particularly in the context of errors during interaction is explained in terms of slips and ______.", "type": "single", "options": ["error", "mistakes", "human error"], "answer": "mistakes"}, {"week": 4, "q": "Paper mock-ups are the example of __________ prototype.", "type": "single", "options": ["Low fidelity", "High fidelity", "Medium fidelity"], "answer": "Low fidelity"}, {"week": 4, "q": "In Norman’s Model of Interaction the actions represent the ______ and sensory-motor activities of the user", "type": "single", "options": ["Cognitive", "Emotional", "Affective"], "answer": "Cognitive"}, {"week": 4, "q": "Which is from the following is not valid categories of prototypes", "type": "single", "options": ["Horizontal", "Vertical", "Storyboard"], "answer": "Storyboard"}, {"week": 5, "q": "How do we evaluate an interface?", "type": "single", "options": ["by evaluating satisfaction", "by evaluating memorability", "by evaluating usability"], "answer": "by evaluating usability"}, {"week": 5, "q": "For expert evaluation, an evaluation team of 3-5 members is necessary.", "type": "single", "options": ["True", "False"], "answer": "True"}, {"week": 5, "q": "In a heuristic evaluation, the items in the checklist are called __________", "type": "single", "options": ["checkbox", "heuristics", "usability issues", "problems"], "answer": "heuristics"}, {"week": 5, "q": "Data collected in evaluation with self-reports method is sometimes called _______ or preference data", "type": "single", "options": ["objective", "subjective", "self data", "automation"], "answer": "subjective"}, {"week": 5, "q": "There are many ways of collecting user feedback in evaluation with self report methods: ______________ , can ask them to choose from a list of system attributes ask direct and open-ended questions.", "type": "single", "options": ["Utter the option", "Rating on a scale"], "answer": "Rating on a scale"}, {"week": 5, "q": "ASQ is a ___________________.", "type": "single", "options": ["Post-task questionnaire", "Post-session questionnaire"], "answer": "Post-task questionnaire"}, {"week": 5, "q": "It is generally assumed that an SUS score around _______ percent or higher is desirable", "type": "single", "options": ["10", "20", "50", "70"], "answer": "70"}, {"week": 5, "q": "In heuristic evaluation, a system is evaluated with a checklist are called ____", "type": "single", "options": ["Heuristics", "Actions", "Statement"], "answer": "Heuristics"}, {"week": 5, "q": "Nielsen, 1994 proposed _______ heuristics for expert evaluation", "type": "single", "options": ["5", "7", "9", "10"], "answer": "10"}, {"week": 5, "q": "What is the full form of SUS", "type": "single", "options": ["Software usability score", "Software usability scale", "System usability score", "System usability scale"], "answer": "System usability scale"}, {"week": 6, "q": "Which of the following is NOT a characteristic of Good design", "type": "single", "options": ["Coverage", "Correctness", "Understandability", "Colorful"], "answer": "Colorful"}, {"week": 6, "q": "If all functions perform similar operations it falls under ________ cohesion.", "type": "single", "options": ["Logical", "Temporal", "Procedural", "Sequential"], "answer": "Logical"}, {"week": 6, "q": "If two modules share code, it falls under __________ coupling.", "type": "single", "options": ["Data", "Control", "Content"], "answer": "Content"}, {"week": 6, "q": "There are two basic design approaches: function oriented and _______ oriented.", "type": "single", "options": ["Logic", "Folder", "Object", "Class"], "answer": "Object"}, {"week": 6, "q": "Basic components of ER diagram are: Entity, _____ and Relationship", "type": "single", "options": ["Object", "User", "Attribute", "Class"], "answer": "Attribute"}, {"week": 6, "q": "In DFD data can flow from store to external entity.", "type": "single", "options": ["True", "False"], "answer": "False"}, {"week": 6, "q": "Which of the following is/are the type of cohesion?", "type": "multi", "options": ["Temporal", "Functional", "Content", "All of the above"], "answer": ["Temporal", "Functional"]}, {"week": 6, "q": "Which one from the following are related with between modules?", "type": "single", "options": ["Cohesion", "Coupling", "Both"], "answer": "Coupling"}, {"week": 6, "q": "Data stores are first shown at", "type": "single", "options": ["Level 0 (context diagram)", "Level 1 (overview diagram)", "Level 1 (detailed diagram)"], "answer": "Level 1 (overview diagram)"}, {"week": 6, "q": "ERD was proposed by Peter Chen in the year", "type": "single", "options": ["1967", "1986", "1976"], "answer": "1976"}, {"week": 7, "q": "In functional design approach we think of the system as provider of a set of “services” represented as ________.", "type": "single", "options": ["Data", "Functions", "Objects"], "answer": "Functions"}, {"week": 7, "q": "A class contains attributes and ___________.", "type": "single", "options": ["Data", "Operations", "Objects"], "answer": "Operations"}, {"week": 7, "q": "Full form of OOA is:", "type": "single", "options": ["object oriented assignment", "object oriented assistance", "object oriented analysis", "object oriented attributes"], "answer": "object oriented analysis"}, {"week": 7, "q": "UML is a language to represent", "type": "single", "options": ["OOP", "OOA", "OOD"], "answer": "OOD"}, {"week": 7, "q": "Implementation view can be captured using ________.", "type": "single", "options": ["Deployment diagram", "Component diagram", "Class diagram", "Use case diagram"], "answer": "Component diagram"}, {"week": 7, "q": "Once interface design stabilized and no further iteration required, we can focus on code design", "type": "single", "options": ["True", "False"], "answer": "True"}, {"week": 7, "q": "In object oriented design approach, we think of system as a collection of “objects” and their ________", "type": "single", "options": ["behavior", "both"], "answer": "behavior"}, {"week": 7, "q": "A operation can be", "type": "single", "options": ["private", "public", "both"], "answer": "both"}, {"week": 7, "q": "UML supports ______________ views of a system", "type": "single", "options": ["3", "5", "7", "9"], "answer": "5"}, {"week": 7, "q": "In UML diagram, structural view consists of ________ and _______", "type": "multi", "options": ["sequence diagram", "class diagram", "object diagram"], "answer": ["class diagram", "object diagram"]}, {"week": 8, "q": "Following standard coding guidelines helps to improve ______.", "type": "single", "options": ["Readability only", "Understandability only", "Teamwork only", "Readability, understandability, and teamwork"], "answer": "Readability, understandability, and teamwork"}, {"week": 8, "q": "A function should have no longer than _____ lines of code.", "type": "single", "options": ["5", "16", "10", "8"], "answer": "10"}, {"week": 8, "q": "What are some things to avoid when writing code? (Choose all that apply)", "type": "multi", "options": ["Using lengthy functions", "Using the same identifier for multiple purposes", "Using ‘goto’ (branching) statements indiscriminately", "Using proper indentation"], "answer": ["Using lengthy functions", "Using the same identifier for multiple purposes", "Using ‘goto’ (branching) statements indiscriminately"]}, {"week": 8, "q": "Two broad categories of code testing methods are review-based method and __________ method.", "type": "single", "options": ["Execution-based"], "answer": "Execution-based"}, {"week": 8, "q": "What are the two common methods for review-based testing? (Choose all that apply)", "type": "multi", "options": ["Code inspection", "Code walkthrough", "Unit testing"], "answer": ["Code inspection", "Code walkthrough"]}, {"week": 8, "q": "White-box testing refers to designing test cases using knowledge of internal structure of the software.", "type": "single", "options": ["True", "False"], "answer": "True"}, {"week": 8, "q": "How many members should be present in a code walkthrough team?", "type": "single", "options": ["2–3 members", "3–5 members", "5–7 members", "7–10 members"], "answer": "3–5 members"}, {"week": 8, "q": "Which of the following code testing method requires simulation of code execution by hand?", "type": "single", "options": ["Code walkthrough", "Code inspection", "Black box testing", "White box testing"], "answer": "Code walkthrough"}, {"week": 8, "q": "Uninitialized variable is one of the common errors in programming that can be identified through code inspection", "type": "single", "options": ["True", "False"], "answer": "True"}, {"week": 8, "q": "Which of the following is not required to perform black box testing?", "type": "single", "options": ["Equivalence class partitioning", "Boundary value analysis", "Test suite creation", "Knowledge of the internal structure of the code"], "answer": "Knowledge of the internal structure of the code"}, {"week": 9, "q": "Set of all test cases with which a given software is to be tested is known as ________.", "type": "single", "options": ["Testcase", "Test suite"], "answer": "Test suite"}, {"week": 9, "q": "Review based testing is good for early evaluation to ‘clean up’ the code before more rigorous and formal testing is done.", "type": "single", "options": ["True", "False"], "answer": "True"}, {"week": 9, "q": "Randomly selected test cases do not necessarily contribute to significance of test suite.", "type": "single", "options": ["True", "False"], "answer": "True"}, {"week": 9, "q": "In black box testing the two main approaches to design test vases are: Equivalence class partitioning and _______________.", "type": "single", "options": ["Structural analysis", "Boundary value analysis", "Equivalence class analysis", "System analysis"], "answer": "Boundary value analysis"}, {"week": 9, "q": "Testing code with any _____ value(s) of an equivalence class is as good as testing with ALL input values belonging to that class.", "type": "single", "options": ["one", "two", "five", "four"], "answer": "one"}, {"week": 9, "q": "In black box testing, domain of input values partitioned into sets, each sets are called _________.", "type": "single", "options": ["Equivalence class", "Program class"], "answer": "Equivalence class"}, {"week": 9, "q": "Black box testing is a _____ testing.", "type": "single", "options": ["Functional testing", "Structural testing"], "answer": "Functional testing"}, {"week": 9, "q": "Execution based testing can also be called as formal program testing.", "type": "single", "options": ["True", "False"], "answer": "True"}, {"week": 9, "q": "Which of the following is/are code testing method categories", "type": "multi", "options": ["Review-based", "Execution-based", "Analysis-based"], "answer": ["Review-based", "Execution-based"]}, {"week": 9, "q": "Domain of input values partitioned into set is called equivalence class", "type": "single", "options": ["True", "False"], "answer": "True"}, {"week": 10, "q": "To do a white-box testing, knowledge of internal structure is required.", "type": "single", "options": ["True", "False"], "answer": "True"}, {"week": 10, "q": "To construct a CFG we assign numbers to all statements of the program, create a node in the CFG for each numbered statement and _______.", "type": "single", "options": ["Complement the CFG", "Add edges", "Sort the nodes"], "answer": "Add edges"}, {"week": 10, "q": "In path coverage, test cases should ensure all __________ in the code executed at least once", "type": "single", "options": ["Linearly independent paths", "Linearly dependent paths"], "answer": "Linearly independent paths"}, {"week": 10, "q": "Three main stages of system testing is alpha testing, beta testing and _________.", "type": "single", "options": ["Gama testing", "Sigma testing", "Acceptance testing", "Omega testing"], "answer": "Acceptance testing"}, {"week": 10, "q": "There are _____ stages of empirical research.", "type": "single", "options": ["Three", "Four", "Five", "Six"], "answer": "Four"}, {"week": 10, "q": "Data we get from observation is ________ data", "type": "single", "options": ["Reflective", "Empirical", "Authoritative", "Experiential"], "answer": "Empirical"}, {"week": 10, "q": "Node in a CFG for each numbered _________", "type": "single", "options": ["Line number", "End of parentheses", "Statement"], "answer": "Statement"}, {"week": 10, "q": "Each subsystem tested separately and then full system tested. This type of testing is known as", "type": "single", "options": ["Bottom-up testing", "Top-down"], "answer": "Bottom-up testing"}, {"week": 10, "q": "Stubs are used to simulate effect of ___________ routines called by the routines under test.", "type": "single", "options": ["lower-level", "upper-level"], "answer": "lower-level"}, {"week": 10, "q": "Friendly customers are recruited for", "type": "single", "options": ["Alpha testing", "Beta testing", "Acceptance testing"], "answer": "Beta testing"}, {"week": 11, "q": "When we perform a controlled experiment to collect and analyze data on user behavior, the entire process is known as _______.", "type": "single", "options": ["programmable research", "hypothetical research", "empirical research", "theoretical research"], "answer": "empirical research"}, {"week": 11, "q": "There are broadly _____ stages of empirical research?", "type": "single", "options": ["Two", "three", "four", "five"], "answer": "four"}, {"week": 11, "q": "RQ1: Is the new technique good? RQ2: Is our text input interface better than the text input interface provided by, say, MS Word? RQ3: Does the new interface let me enter text “faster” than MS Word? We call RQ3 ______ and RQ1 as _______.", "type": "single", "options": ["testable, non-testable", "alternative hypothesis, null hypothesis"], "answer": "testable, non-testable"}, {"week": 11, "q": "When we form a hypothesis, essentially stating that the test condition is not going to affect the outcome (judgment). This hypothesis is called _______.", "type": "single", "options": ["null hypothesis", "alternative hypothesis"], "answer": "null hypothesis"}, {"week": 11, "q": "In _______, we assign some (arbitrary) codes to attributes of observational data.", "type": "single", "options": ["nominal", "ordinal", "interval", "ratio"], "answer": "nominal"}, {"week": 11, "q": "Recording data from a thermometer is an example of interval scaled data.", "type": "single", "options": ["True", "False"], "answer": "True"}, {"week": 11, "q": "_______ are variables that influence both the independent and dependent variables in a study, potentially leading to incorrect conclusions about the relationship between the two.", "type": "single", "options": ["Dependant variables", "Independent variables", "Confounding variables", "Control variables"], "answer": "Confounding variables"}, {"week": 11, "q": "For any pilot study (or small-scale studies), 5 is probably a good number.", "type": "single", "options": ["True", "False"], "answer": "True"}, {"week": 11, "q": "To draw reliable conclusions from empirical data, we should use between _____ and _____ participants.", "type": "single", "options": ["2, 5", "12, 25", "10, 12"], "answer": "12, 25"}, {"week": 11, "q": "When we distribute the tasks to participants in the way explained above, we call the study as _______.", "type": "single", "options": ["between-subject", "within-subject", "uni-subject", "center-subject"], "answer": "between-subject"}, {"week": 12, "q": "With the significance test, we try to _______ the null hypothesis.", "type": "single", "options": ["Accept", "Refute"], "answer": "Refute"}, {"week": 12, "q": "Type I error is also known as _______.", "type": "single", "options": ["False positive", "False negative", "True positive", "True negative"], "answer": "False positive"}, {"week": 12, "q": "t-statistic is the ONLY way to test for statistical significance", "type": "single", "options": ["True", "False"], "answer": "False"}, {"week": 12, "q": "There are broadly two categories of the techniques for significance test: _______ and _______.", "type": "single", "options": ["Parametric and Non-parametric", "t-test and non t-test"], "answer": "Parametric and Non-parametric"}, {"week": 12, "q": "Project planning involves estimation of Project size, Cost, Duration and Effort.", "type": "single", "options": ["True", "False"], "answer": "True"}, {"week": 12, "q": "COCOMO stands for _______.", "type": "single", "options": ["Conducive Cost Estimation Model", "Constructive Cost Estimation Model", "Constructive Category Estimation Model", "Conducive Category Estimation Model"], "answer": "Constructive Cost Estimation Model"}, {"week": 12, "q": "According to Boehm, software cost estimation should be done through _______ stages.", "type": "single", "options": ["Two", "Three", "Four", "Five"], "answer": "Three"}, {"week": 12, "q": "Agile development ensure quick turn-around of projects", "type": "single", "options": ["True", "False"], "answer": "True"}, {"week": 12, "q": "Scrum is a _______ method.", "type": "single", "options": ["Traditional SDLC", "Agile"], "answer": "Agile"}, {"week": 12, "q": "In a Gantt chart the length is proportional to _______ for activity", "type": "single", "options": ["Duration planned", "Effort", "Cost"], "answer": "Duration planned"}];
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function norm(s){return String(s||"").trim().toLowerCase().replace(/\s+/g," ").replace(/[\u2018\u2019]/g,"'")}
const questions=shuffle(quizData),form=document.getElementById("quizForm");
document.getElementById("metaLine").textContent=`${questions.length} questions loaded • Weeks 1–12 • Questions and options are shuffled on each refresh.`;
function render(){form.innerHTML="";questions.forEach((x,i)=>{let card=document.createElement("div");card.className="question-card";let input="";
if(x.type==="text"){input=`<input class="text-answer" type="text" name="q${i}" placeholder="Type your answer here" autocomplete="off">`;}
else if(x.type==="multi"){input=`<div class="options">${shuffle(x.options).map(o=>`<label class="opt"><input type="checkbox" name="q${i}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join("")}</div>`;}
else{input=`<div class="options">${shuffle(x.options).map(o=>`<label class="opt"><input type="radio" name="q${i}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join("")}</div>`;}
card.innerHTML=`<div class="qtop"><p class="qtitle">${i+1}) ${esc(x.q)}</p><div class="week-badge">Week ${x.week}</div></div>${input}<div class="result" id="r${i}"></div>`;form.appendChild(card)})}
function sameMulti(a,b){a=[...new Set(a.map(norm))].sort();b=[...new Set(b.map(norm))].sort();return a.length===b.length&&a.every((v,i)=>v===b[i]);}
function submitQuiz(){let score=0,c=0,w=0,b=0;questions.forEach((x,i)=>{let r=document.getElementById(`r${i}`),answered=false,ok=false;
if(x.type==="text"){let el=document.querySelector(`[name="q${i}"]`);answered=!!el.value.trim();ok=answered&&norm(el.value)===norm(x.answer);}
else if(x.type==="multi"){let vals=[...document.querySelectorAll(`input[name="q${i}"]:checked`)].map(e=>e.value);answered=vals.length>0;ok=answered&&sameMulti(vals,x.answer);}
else{let sel=document.querySelector(`input[name="q${i}"]:checked`);answered=!!sel;ok=answered&&norm(sel.value)===norm(x.answer);}
let ans=Array.isArray(x.answer)?x.answer.join(", "):x.answer;
if(!answered){b++;r.textContent=`❌ Not Answered | Correct: ${ans}`;r.className="result wrong";}
else if(ok){score++;c++;r.textContent="✅ Correct";r.className="result correct";}
else{w++;r.textContent=`❌ Wrong | Correct: ${ans}`;r.className="result wrong";}});
document.getElementById("scoreBox").innerHTML=`Final Score: ${score} / ${questions.length}<span class="scoredetails">Correct: ${c} &nbsp;|&nbsp; Wrong: ${w} &nbsp;|&nbsp; Not Answered: ${b}</span>`;
window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});}
function resetQuiz(){render();document.getElementById("scoreBox").textContent="Submit the quiz to see your score.";window.scrollTo({top:0,behavior:"smooth"})}
render();
</script></body></html>

<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#111827;--muted:#6b7280;--border:#e5e7eb;--shadow:0 8px 24px rgba(0,0,0,.06);--green:#118a3a;--red:#c0262d;--accent:#111827;--soft:#eef2ff;--softText:#3730a3}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1200px;margin:0 auto;padding:28px 18px 48px}
header{text-align:center;padding:18px 0 26px}
h1{margin:0 0 10px;font-size:clamp(30px,4vw,52px);line-height:1.05;color:#000;font-weight:800}
.subtitle{margin:0 auto;max-width:850px;font-size:15px;color:var(--muted);line-height:1.6}
.audit{max-width:900px;margin:0 auto 16px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 15px;color:#4b5563;font-size:13px;line-height:1.55;text-align:center}
.weekbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
.weekbtn{border:1px solid var(--border);background:#fff;color:#374151;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:800;cursor:pointer}
.weekbtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.toolbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
button.action{border:0;border-radius:12px;padding:12px 20px;font-size:15px;font-weight:800;cursor:pointer}
.btn-primary{background:var(--accent);color:#fff}.btn-secondary{background:#e5e7eb;color:#374151}
.meta{text-align:center;color:var(--muted);font-size:14px;margin-bottom:18px}
form{display:grid;gap:16px}
.question-card{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:20px}
.qtop{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:12px}
.qtitle{font-size:17px;line-height:1.55;margin:0;font-weight:600}
.week-badge{flex:0 0 auto;background:var(--soft);color:var(--softText);border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800}
.options{display:grid;gap:9px}
label.opt{display:flex;gap:10px;align-items:flex-start;line-height:1.45;font-size:15px;cursor:pointer}
label.opt input{margin-top:4px}
.text-answer{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-size:15px}
.result{margin-top:12px;font-size:14px;font-weight:800;min-height:20px}.correct{color:var(--green)}.wrong{color:var(--red)}
.scorebox{margin-top:20px;background:#fff;border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:18px;text-align:center;font-size:18px;font-weight:800}
.scoredetails{display:block;margin-top:8px;color:var(--muted);font-size:14px}
.sticky-submit{position:sticky;bottom:14px;z-index:3;display:flex;justify-content:center;margin-top:18px}
.sticky-submit button{box-shadow:0 10px 24px rgba(0,0,0,.14)}
@media(max-width:640px){.question-card{padding:16px}.qtitle{font-size:16px}.qtop{flex-direction:column}.week-badge{align-self:flex-start}}
</style>
</head>

swer": "object oriented analysis"}, {"week": 7, "q": "UML is a language to represent", "type": "single", "options": ["OOP", "OOA", "OOD"], "answer": "OOD"}, {"week": 7, "q": "UML is a design methodology", "type": "single", "options": ["True", "False"], "answer": "False"}, {"week": 7, "q": "______ objects normally hold information (e.g. book, book registers etc.).", "type": "single", "options": ["Boundary", "Controller", "Entity"], "answer": "Entity"}, {"week": 7, "q": "Once interface design stabilized and no further iteration required, we can focus on code design", "type": "single", "options": ["True", "False"], "answer": "True"}, {"week": 7, "q": "What is the full form of UML?", "type": "single", "options": ["User Modeling Language", "Universal Modeling Language", "Unified Modeling Language"], "answer": "Unified Modeling Language"}, {"week": 7, "q": "In object oriented design approach, we think of system as a collection of “objects” and their", "type": "single", "options": ["function", "behavior", "both"], "answer": "behavior"}, {"week": 7, "q": "What is the full form of OOP?", "type": "single", "options": ["Object oriented planning", "Object oriented processing", "Object oriented programming"], "answer": "Object oriented programming"}, {"week": 7, "q": "UML supports ______ views of a system", "type": "single", "options": ["3", "5", "7"], "answer": "5"}, {"week": 8, "q": "Coding standards/guidelines helps to follow standard coding practices/guidelines", "type": "single", "options": ["True", "False"], "answer": "True"}, {"week": 8, "q": "Two broad categories of testing methods are: review based and ______ based", "type": "single", "options": ["Execution", "Reading", "Heuristic"], "answer": "Execution"}, {"week": 8, "q": "There are two broad approaches of code review based testing: Code inspection and", "type": "single", "options": ["Code initiation", "Code execution", "Code walkthrough", "Code analysis"], "answer": "Code walkthrough"}, {"week": 8, "q": "Code inspection is similar to", "type": "single", "options": ["Cognitive walkthrough", "Heuristic evaluation"], "answer": "Heuristic evaluation"}, {"week": 8, "q": "The systematic code testing can be broadly divided into two types: Black-box and ______ testing.", "type": "single", "options": ["White-box", "Green box", "Purple box"], "answer": "White-box"}, {"week": 8, "q": "While discussing in a code walkthrough meeting, the members should focus on discovery of errors and not how to fix errors.", "type": "single", "options": ["True", "False"], "answer": "True"}, {"week": 8, "q": "A set of all test cases with which a given software is to be tested is called", "type": "single", "options": ["Test case", "Test suite", "Test member"], "answer": "Test suite"}, {"week": 8, "q": "Global variable names may always start with a ______ letter.", "type": "single", "options": ["Small letter", "Capital letter"], "answer": "Capital letter"}, {"week": 8, "q": "Function length should not exceed ______ lines.", "type": "single", "options": ["3", "7", "9", "10"], "answer": "10"}, {"week": 8, "q": "Which one of the following is not a broad variety of code testing method categories?", "type": "single", "options": ["Review-based", "Execution-based", "Analysis-based"], "answer": "Analysis-based"}, {"week": 9, "q": "Set of all test cases with which a given software is to be tested is known as", "type": "single", "options": ["Testcase", "Test suite"], "answer": "Test suite"}, {"week": 9, "q": "Randomly selected test cases do not necessarily contribute to significance of test suite.", "type": "single", "options": ["True", "False"], "answer": "True"}, {"week": 9, "q": "Test cases designed using knowledge of internal structure of software is known as", "type": "single", "options": ["Structural testing", "Functional testing"], "answer": "Structural testing"}, {"week": 9, "q": "In black box testing the two main approaches to design test cases are: Equivalence class partitioning and ______.", "type": "single", "options": ["Structural analysis", "Boundary value analysis", "System analysis"], "answer": "Boundary value analysis"}, {"week": 9, "q": "Testing code with any ______ value(s) of an equivalence class is as good as testing with ALL input values belonging to that class.", "type": "single", "options": ["One", "Two", "Five", "Four"], "answer": "One"}, {"week": 9, "q": "Test cases should contain both input and expected output.", "type": "single", "options": ["True", "False"], "answer": "True"}, {"week": 9, "q": "Black box testing is a ______ testing.", "type": "single", "options": ["Functional testing", "Structural testing"], "answer": "Functional testing"}, {"week": 9, "q": "Which is/are from the following are valid review based testing?", "type": "multi", "options": ["Code walkthrough", "Code inspection", "Code analysis", "Code assessment"], "answer": ["Code walkthrough", "Code inspection"]}, {"week": 9, "q": "Review based testing is good for early evaluation to ‘clean up’ the code before more rigorous and formal testing is done.", "type": "single", "options": ["True", "False"], "answer": "True"}, {"week": 9, "q": "In black box testing, domain of input values partitioned into sets, each set is called", "type": "single", "options": ["Partition class", "Equivalence class", "Program class"], "answer": "Equivalence class"}, {"week": 10, "q": "To understand white-box testing strategies, program flow visualization helps. To visualize the program we can take help of", "type": "single", "options": ["CFG", "DFD", "ERD", "Class diagram"], "answer": "CFG"}, {"week": 10, "q": "Branch coverage guarantees statement coverage.", "type": "single", "options": ["True", "False"], "answer": "True"}, {"week": 10, "q": "In path coverage, test cases should ensure all ______ in the code executed at least once", "type": "single", "options": ["Linearly independent paths", "Linearly dependent paths"], "answer": "Linearly independent paths"}, {"week": 10, "q": "Volume testing tests system performance for ______ input", "type": "single", "options": ["Small", "Large"], "answer": "Large"}, {"week": 10, "q": "There are ______ stages of empirical research.", "type": "single", "options": ["Three", "Four", "Six"], "answer": "Four"}, {"week": 10, "q": "Data we get from observation is ______ data.", "type": "single", "options": ["Reflective", "Empirical", "Authoritative", "Experiential"], "answer": "Empirical"}, {"week": 10, "q": "What is the full form of CFG?", "type": "single", "options": ["Code Free Graph", "Code Flow Graph", "Control Flow Graph", "Control Free Graph"], "answer": "Control Flow Graph"}, {"week": 10, "q": "Driver routines are used for", "type": "single", "options": ["Bottom-up testing", "Top-down testing"], "answer": "Bottom-up testing"}, {"week": 10, "q": "Stubs are used to simulate effect of ______ routines called by the routines under test.", "type": "single", "options": ["lower-level", "upper-level"], "answer": "lower-level"}, {"week": 10, "q": "Alpha testing is carried out by test team within organization", "type": "single", "options": ["True", "False"], "answer": "True"}, {"week": 11, "q": "When we perform a controlled experiment to collect and analyze data on user behavior, the entire process is known as", "type": "single", "options": ["Explanatory Research", "Empirical Research", "Theoretical Research", "Non-Experimental Research"], "answer": "Empirical Research"}, {"week": 11, "q": "Design of experiment is one of the four stages of empirical research", "type": "single", "options": ["True", "False"], "answer": "True"}, {"week": 11, "q": "While framing research question, our aim is to frame a ______ question", "type": "single", "options": ["Variable", "Testable"], "answer": "Testable"}, {"week": 11, "q": "“Testable research questions” are more popularly known as, in the domain of behavioral research", "type": "single", "options": ["Research hypotheses", "Research conclusion", "Research methodology"], "answer": "Research hypotheses"}, {"week o known as", "type": "single", "options": ["α error or “false positive”", "α error or “false negative”", "β error or “false negative”", "β error or “false positive”"], "answer": "α error or “false positive”"}, {"week": 12, "q": "In a parametric test data should come from a ______ distributed population.", "type": "single", "options": ["Normally", "Uniformly"], "answer": "Normally"}, {"week": 12, "q": "According to Boehm, software cost estimation should be done through ______ stages.", "type": "single", "options": ["Two", "Three", "Four"], "answer": "Three"}, {"week": 12, "q": "If a project deals with a team that is small in size and well versed with the application program (experienced), it is a ______ type of project.", "type": "single", "options": ["Organic", "Semi-detached", "Embedded"], "answer": "Organic"}, {"week": 12, "q": "Rigidity in traditional SDLC may lead to time and cost overruns.", "type": "single", "options": ["True", "False"], "answer": "True"}, {"week": 12, "q": "Agile iteration workflow typically takes", "type": "single", "options": ["2-4 weeks", "3-6 weeks", "4-6 weeks", "None of these"], "answer": "4-6 weeks"}];

function shuffle(a){
  a=[...a];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function esc(s){
  return String(s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function norm(s){
  return String(s||"").trim().toLowerCase().replace(/\s+/g," ").replace(/[\u2018\u2019]/g,"'");
}

  bar.innerHTML="";
  const all=document.createElement("button");
  all.className="weekbtn"+(selectedWeek===0?" active":"");
  all.textContent="All (120)";
  all.onclick=()=>selectWeek(0);
  bar.appendChild(all);

  for(let w=1;w<=12;w++){
    const b=document.createElement("button");
    b.className="weekbtn"+(selectedWeek===w?" active":"");
    b.textContent=`Week ${w} (10)`;
    b.onclick=()=>selectWeek(w);
    bar.appendChild(b);
  }
}

function selectWeek(w){
  selectedWeek=w;
  render();
  buildWeeks();
  document.getElementById("scoreBox").textContent="Submit the quiz to see your score.";
  window.scrollTo({top:0,behavior:"smooth"});
}

function render(){
  questions=shuffle(selectedWeek===0?quizData:quizData.filter(x=>x.week===selectedWeek));
  const form=document.getElementById("quizForm");
  form.innerHTML="";
  document.getElementById("metaLine").textContent=
    selectedWeek===0
      ? "All 120 questions • Weeks 1–12 • Questions and options are shuffled."
      : `Week ${selectedWeek} • 10 questions • Questions and options are shuffled.`;

  questions.forEach((x,i)=>{
    const card=document.createElement("div");
    card.className="question-card";
    let input="";

    if(x.type==="text"){
      input=`<input class="text-answer" name="q${i}" type="text" placeholder="Type your answer here" autocomplete="off">`;
    }else if(x.type==="multi"){
      input=`<div class="options">${shuffle(x.options).map(o=>
        `<label class="opt"><input type="checkbox" name="q${i}" value="${esc(o)}"><span>${esc(o)}</span></label>`
      ).join("")}</div>`;
    }else{
      input=`<div class="options">${shuffle(x.options).map(o=>
        `<label class="opt"><input type="radio" name="q${i}" value="${esc(o)}"><span>${esc(o)}</span></label>`
      ).join("")}</div>`;
    }

    card.innerHTML=`
      <div class="qtop">
        <p class="qtitle">${i+1}) ${esc(x.q)}</p>
        <div class="week-badge">Week ${x.week}</div>
      </div>
      ${input}
      <div class="result" id="r${i}"></div>
    `;
    form.appendChild(card);
  });
}

function sameMulti(a,b){
  a=[...new Set(a.map(norm))].sort();
  b=[...new Set(b.map(norm))].sort();
  return a.length===b.length && a.every((v,i)=>v===b[i]);
}

function submitQuiz(){
  let score=0,correct=0,wrong=0,blank=0;

  questions.forEach((x,i)=>{
    const r=document.getElementById(`r${i}`);
    let answered=false,ok=false;

    if(x.type==="text"){
      const el=document.querySelector(`[name="q${i}"]`);
      answered=!!el.value.trim();
      ok=answered && norm(el.value)===norm(x.answer);
    }else if(x.type==="multi"){
      const vals=[...document.querySelectorAll(`input[name="q${i}"]:checked`)].map(e=>e.value);
      answered=vals.length>0;
      ok=answered && sameMulti(vals,x.answer);
    }else{
      const sel=document.querySelector(`input[name="q${i}"]:checked`);
      answered=!!sel;
      ok=answered && norm(sel.value)===norm(x.answer);
    }

    const ans=Array.isArray(x.answer)?x.answer.join(", "):x.answer;

    if(!answered){
      blank++;
      r.textContent=`❌ Not Answered | Correct: ${ans}`;
      r.className="result wrong";
    }else if(ok){
      score++;correct++;
      r.textContent="✅ Correct";
      r.className="result correct";
    }else{
      wrong++;
      r.textContent=`❌ Wrong | Correct: ${ans}`;
      r.className="result wrong";
    }
  });

  document.getElementById("scoreBox").innerHTML=
    `Score: ${score} / ${questions.length}`
    +`<span class="scoredetails">Correct: ${correct} &nbsp;|&nbsp; Wrong: ${wrong} &nbsp;|&nbsp; Not Answered: ${blank}</span>`;

  window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}

function resetQuiz(){
  render();
  document.getElementById("scoreBox").textContent="Submit the quiz to see your score.";
  window.scrollTo({top:0,behavior:"smooth"});
}

buildWeeks();
render();
</script>

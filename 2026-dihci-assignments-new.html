<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 DiHCI Assignments</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#111827;--muted:#6b7280;--border:#e5e7eb;--shadow:0 8px 24px rgba(0,0,0,.06);--green:#118a3a;--red:#c0262d;--accent:#111827;--soft:#eef2ff;--softText:#3730a3}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1200px;margin:0 auto;padding:28px 18px 48px} header{text-align:center;padding:18px 0 26px}
h1{margin:0 0 10px;font-size:clamp(30px,4vw,52px);line-height:1.05;color:#000;font-weight:800}
.subtitle{margin:0 auto;max-width:820px;font-size:15px;color:var(--muted);line-height:1.6}
.toolbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
button{border:0;border-radius:12px;padding:12px 20px;font-size:15px;font-weight:800;cursor:pointer}
.btn-primary{background:var(--accent);color:#fff}.btn-secondary{background:#e5e7eb;color:#374151}
.meta{text-align:center;color:var(--muted);font-size:14px;margin-bottom:18px}
form{display:grid;gap:16px}.question-card{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:20px}
.qtop{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:12px}
.qtitle{font-size:17px;line-height:1.55;margin:0;font-weight:600}.week-badge{flex:0 0 auto;background:var(--soft);color:var(--softText);border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800}
.options{display:grid;gap:9px}label.opt{display:flex;gap:10px;align-items:flex-start;line-height:1.45;font-size:15px;cursor:pointer}label.opt input{margin-top:4px}
.result{margin-top:12px;font-size:14px;font-weight:800;min-height:20px}.correct{color:var(--green)}.wrong{color:var(--red)}
.scorebox{margin-top:20px;background:#fff;border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:18px;text-align:center;font-size:18px;font-weight:800}
.scoredetails{display:block;margin-top:8px;color:var(--muted);font-size:14px}.sticky-submit{position:sticky;bottom:14px;z-index:3;display:flex;justify-content:center;margin-top:18px}
.sticky-submit button{box-shadow:0 10px 24px rgba(0,0,0,.14)}@media(max-width:640px){.question-card{padding:16px}.qtitle{font-size:16px}}
</style>
</head>
<body><div class="wrap">
<header><h1>2026 DiHCI Assignments</h1><p class="subtitle">Interactive week-wise practice with shuffled questions and options, instant scoring, and correct-answer feedback.</p></header>
<div class="toolbar"><button class="btn-primary" type="button" onclick="submitQuiz()">Submit</button><button class="btn-secondary" type="button" onclick="resetQuiz()">Reset</button></div>
<div class="meta" id="metaLine"></div><form id="quizForm"></form>
<div class="sticky-submit"><button class="btn-primary" type="button" onclick="submitQuiz()">Submit</button></div>
<div class="scorebox" id="scoreBox">Submit the quiz to see your score.</div></div>
<script>
const quizData=[{"week": 1, "q": "While we talk about the evaluation phases of the computer, ______ is called the modern age of computers.", "options": ["1985 onwards", "1998 onwards", "2007 onwards", "2011 onwards"], "answer": "2011 onwards"}, {"week": 1, "q": "Which among the following is NOT a generic category of users?", "options": ["Novice", "Super knowledgeable", "Intermittent", "Expert"], "answer": "Super knowledgeable"}, {"week": 1, "q": "In the Spiral Model, why is the second quadrant crucial for interactive software development?", "options": ["It defines the UI layout", "It finalizes the system architecture", "It identifies and mitigates usability risks via prototyping", "It handles testing and deployment"], "answer": "It identifies and mitigates usability risks via prototyping"}, {"week": 1, "q": "What does the term 'utility' refer to in the context of usability?", "options": ["Speed of task completion", "Visual appeal of the design", "Functional support for user needs", "Frequency of feature updates"], "answer": "Functional support for user needs"}, {"week": 1, "q": "Which one of the following is NOT a computer?", "options": ["Desktop", "Digital Pedometer", "Smartphone", "None of the above"], "answer": "None of the above"}, {"week": 1, "q": "Interactive software development is ______ in nature.", "options": ["sporadic", "iterative", "variable", "discrete"], "answer": "iterative"}, {"week": 1, "q": "Which of the following is NOT one of the five quality components of usability proposed by Jacob Nielsen?", "options": ["Learnability", "Efficiency", "Satisfaction", "Memorization"], "answer": "Memorization"}, {"week": 1, "q": "Which of the following is NOT a characteristic of the Waterfall model?", "options": ["Feasibility study", "Learnability study", "System integration and testing", "Maintenance"], "answer": "Learnability study"}, {"week": 1, "q": "'Identify objectives' and 'customer evaluation and planning' is in the ______ and ______ quadrant of the spiral model respectively.", "options": ["First, Fourth", "Second, Third", "Third, Fourth", "Fourth, Second"], "answer": "First, Fourth"}, {"week": 1, "q": "Which design approach focuses on what a programmer finds interesting to build?", "options": ["System-Centered Design", "User-Centered Design", "Utility-Based Design", "Participatory Design"], "answer": "System-Centered Design"}, {"week": 2, "q": "Contextual inquiry is also known as ________.", "options": ["Interview", "Observation", "Semi-structured interview"], "answer": "Semi-structured interview"}, {"week": 2, "q": "In SRS, functions are not represented as", "options": ["Function name", "Input", "Output", "Description", "Motivation"], "answer": "Motivation"}, {"week": 2, "q": "Contextual inquiry can be done in ______ and passive mode.", "options": ["active", "semi-active", "neutral"], "answer": "active"}, {"week": 2, "q": "There are ______ stages in contextual inquiry.", "options": ["two", "five", "six", "eight"], "answer": "five"}, {"week": 2, "q": "Which stage in the Contextual Inquiry process involves arranging for recording observations and scripting the procedure?", "options": ["Plan Stage", "Initiate Stage", "Execute Stage", "Reflect Stage"], "answer": "Plan Stage"}, {"week": 2, "q": "Affinity diagram method consists of ______ steps.", "options": ["Three", "Two", "Six", "Five"], "answer": "Five"}, {"week": 2, "q": "Usability requirements is one type of ______.", "options": ["Functional Requirement", "Non-functional requirement"], "answer": "Non-functional requirement"}, {"week": 2, "q": "What is the primary objective of Contextual Inquiry?", "options": ["To watch and observe users perform tasks in their natural work setting", "To conduct semi-structured interviews with users", "To develop design recommendations", "To study user behavior using physical note-taking"], "answer": "To watch and observe users perform tasks in their natural work setting"}, {"week": 2, "q": "What is the purpose of the 'Reflect' stage in the Contextual Inquiry process?", "options": ["To contact the authorities for permission", "To analyze the data collected and identify design goals", "To script the procedure and rehearse for observations"], "answer": "To analyze the data collected and identify design goals"}, {"week": 2, "q": "How long does the Contextual Inquiry process typically continue?", "options": ["One to two weeks", "One to two hours", "One to two months"], "answer": "One to two hours"}, {"week": 3, "q": "In SRS document the functions should describe HOW to get the output from the given input.", "options": ["True", "False"], "answer": "False"}, {"week": 3, "q": "We can also add new functional requirements based on the observations made in contextual inquiry.", "options": ["True", "False"], "answer": "True"}, {"week": 3, "q": "In user-centered design, we have two concerns: Interface design and", "options": ["Machine design", "Hardware design", "Code design", "System design"], "answer": "Code design"}, {"week": 3, "q": "The design-prototype-evaluate cycle primarily caters to ______ design.", "options": ["Interface", "Code", "System"], "answer": "Interface"}, {"week": 3, "q": "Code design can be expressed in natural languages, semi-formal languages and ________.", "options": ["Informal languages", "Formal languages", "Context sensitive languages"], "answer": "Formal languages"}, {"week": 3, "q": "DFD is a ______ code design language.", "options": ["Natural", "Semi-formal", "Informal", "Context sensitive"], "answer": "Semi-formal"}, {"week": 3, "q": "Shneiderman proposed ______ rules that covers broad aspects of interactive systems.", "options": ["Five", "Seven", "Eight", "Nine"], "answer": "Eight"}, {"week": 3, "q": "'The interface should not force users to remember too many things' — this statement falls under '__________', one of the golden rules proposed by Ben Shneiderman.", "options": ["Strive for consistency", "Permit easy reversal of actions", "Reduce short-term memory load", "Keep users in control"], "answer": "Reduce short-term memory load"}, {"week": 3, "q": "Human interface guidelines for the Apple systems are the ________ design guidelines.", "options": ["Generic", "Specific"], "answer": "Specific"}, {"week": 3, "q": "Identification of data structures and algorithms for different modules is done on the ________ phase of code design.", "options": ["Preliminary (high-level design)", "Detailed design"], "answer": "Detailed design"}, {"week": 4, "q": "Norman's Model of Interaction represents behavior of a user of interactive systems in terms of a series of ________.", "options": ["actions", "selection", "manipulation"], "answer": "actions"}, {"week": 4, "q": "There are broadly two stages of interaction: execution stage and ______ stage.", "options": ["design", "evaluation", "interaction"], "answer": "evaluation"}, {"week": 4, "q": "Perceive system state comes under the ______ stage of interaction.", "options": ["execution", "design", "evaluation", "interaction"], "answer": "evaluation"}, {"week": 4, "q": "Actions we specify to translate intentions may not be supported by the interface leading to a gap (gulf) between the first three and the last actions in the execution stage. It is called ______.", "options": ["The gulf of execution", "The gulf of evaluation", "The gulf of Interaction"], "answer": "The gulf of execution"}, {"week": 4, "q": "Particularly in the context of errors during interaction is explained in terms of slips and ______.", "options": ["error", "mistakes", "human error"], "answer": "mistakes"}, {"week": 4, "q": "In a vertical prototype, the entire interface is depicted at the surface level without any functionality.", "options": ["True", "False"], "answer": "False"}, {"week": 4, "q": "Paper mock-ups are the example of ______ prototype.", "options": ["Low fidelity", "High fidelity", "Medium fidelity"], "answer": "Low fidelity"}, {"week": 4, "q": "There is a requirement of 3-5 member team for the cognitive walkthrough.", "options": ["True", "False"], "answer": "True"}, {"week": 4, "q": "In a cognitive walkthrough evaluation, evaluators are expected to answer the questions only in 'yes' or 'no'.", "options": ["True", "False"], "answer": "False"}, {"week": 4, "q": "In this technique, a human subject believes to interact with an autonomous computer. But, in reality, however, the computer is operated by an 'unseen' human being. This technique is called ______ approach.", "options": ["Medium fidelity", "Vertical", "Wizard of Oz", "Incremental"], "answer": "Wizard of Oz"}];
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function norm(s){return String(s).trim().toLowerCase().replace(/\s+/g," ")}
const questions=shuffle(quizData),form=document.getElementById("quizForm");
document.getElementById("metaLine").textContent=`${questions.length} questions loaded • Weeks 1–4 • Questions and options are shuffled on each refresh.`;
function render(){form.innerHTML="";questions.forEach((x,i)=>{let opts=shuffle(x.options);let card=document.createElement("div");card.className="question-card";card.innerHTML=`<div class="qtop"><p class="qtitle">${i+1}) ${esc(x.q)}</p><div class="week-badge">Week ${x.week}</div></div><div class="options">${opts.map(o=>`<label class="opt"><input type="radio" name="q${i}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join("")}</div><div class="result" id="r${i}"></div>`;form.appendChild(card)})}
function submitQuiz(){let score=0,c=0,w=0,b=0;questions.forEach((x,i)=>{let sel=document.querySelector(`input[name="q${i}"]:checked`),r=document.getElementById(`r${i}`);if(!sel){b++;r.textContent=`❌ Not Answered | Correct: ${x.answer}`;r.className="result wrong"}else if(norm(sel.value)===norm(x.answer)){score++;c++;r.textContent="✅ Correct";r.className="result correct"}else{w++;r.textContent=`❌ Wrong | Correct: ${x.answer}`;r.className="result wrong"}});document.getElementById("scoreBox").innerHTML=`Final Score: ${score} / ${questions.length}<span class="scoredetails">Correct: ${c} &nbsp;|&nbsp; Wrong: ${w} &nbsp;|&nbsp; Not Answered: ${b}</span>`;window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"})}
function resetQuiz(){render();document.getElementById("scoreBox").textContent="Submit the quiz to see your score.";window.scrollTo({top:0,behavior:"smooth"})}
render();
</script></body></html>
